<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Beats - Extreme Edition</title>
    <link rel="stylesheet" href="ritmo.css">
    <script src="ritmo.js" defer></script>
</head>
<body>
<div class="top-bar">
    <a href="../../index.html" class="btn-back">⬅️ Volver al Menú</a>
    <h1>Rhythm Beats 🎵 EXTREME</h1>
</div>

<div class="game-container" id="game-container">
    <!-- Panel de Configuración -->
    <div id="setup-panel" class="setup-panel">
        <h2>Cargar Canción & Configurar</h2>

        <label for="audio-upload" class="btn-file">
            📁 Seleccionar Canción (MP3 / WAV)
        </label>
        <input type="file" id="audio-upload" accept="audio/*">
        <span id="file-name">Ningún archivo seleccionado</span>

        <div class="options-grid">
            <div class="option-item">
                <label for="difficulty">Dificultad:</label>
                <select id="difficulty" onchange="cambiarModoTeclas()">
                    <option value="easy">Fácil (4 Teclas - Poca densidad)</option>
                    <option value="medium" selected>Normal (4 Teclas)</option>
                    <option value="hard">Difícil (4 Teclas + Holds)</option>
                    <option value="extreme">🔥 EXTREMO (6 TECLAS + Holds)</option>
                </select>
            </div>

            <div class="option-item">
                <label for="speed">Velocidad de Caída:</label>
                <select id="speed">
                    <option value="0.8">Lenta (1.0x)</option>
                    <option value="1.2" selected>Normal (1.5x)</option>
                    <option value="1.8">Rápida (2.0x)</option>
                </select>
            </div>
        </div>

        <!-- Configuración de Controles -->
        <div class="keybinds-section">
            <h3>Personalizar Controles (<span id="key-count-label">4 Teclas</span>)</h3>
            <div class="keybinds-grid" id="keybinds-container">
                <!-- Se genera dinámicamente según el modo -->
            </div>
        </div>

        <div class="volume-control">
            <label for="init-volume">🔊 Volumen:</label>
            <input type="range" id="init-volume" min="0" max="1" step="0.05" value="0.8">
        </div>

        <button id="btn-start" class="btn-start" disabled>Analizar y Jugar 🚀</button>
        <div id="loading-status" class="loading-status"></div>
    </div>

    <!-- Pantalla de Juego -->
    <div id="play-area" class="play-area hidden">
        <div class="in-game-controls">
            <button id="btn-pause" class="btn-pause">⏸️ Pausa (ESC)</button>
            <div class="volume-control">
                <label for="game-volume">🔊</label>
                <input type="range" id="game-volume" min="0" max="1" step="0.05" value="0.8">
            </div>
            <!-- Control de Offset en vivo -->
            <div class="offset-control">
                <label for="live-offset">⏱️ Offset:</label>
                <input type="range" id="live-offset" min="-200" max="200" step="5" value="-50">
                <span id="offset-val">-50ms</span>
            </div>
        </div>

        <div class="hud">
            <div class="score-box">PUNTOS: <span id="score">0</span></div>
            <div class="combo-box">COMBO: <span id="combo">0</span>x</div>
            <div class="accuracy-box">PRECISIÓN: <span id="accuracy">100</span>%</div>
        </div>

        <canvas id="rhythmCanvas" width="480" height="580"></canvas>

        <div id="hit-feedback" class="hit-feedback"></div>
    </div>

    <!-- Overlay Pausa -->
    <div id="pause-overlay" class="overlay hidden">
        <h2>JUEGO EN PAUSA</h2>
        <button id="btn-resume" class="btn-restart">Continuar ▶️</button>
        <button onclick="location.reload()" class="btn-restart btn-secondary">Reiniciar 🔄</button>
    </div>

    <!-- Overlay Fin de Juego -->
    <div id="game-over-overlay" class="overlay hidden">
        <h2>¡Canción Finalizada! 🎉</h2>
        <div class="results">
            <p>Puntuación: <strong id="res-score">0</strong></p>
            <p>Combo Máximo: <strong id="res-combo">0</strong>x</p>
            <p>Precisión Final: <strong id="res-accuracy">100%</strong></p>
        </div>
        <button onclick="location.reload()" class="btn-restart">Otra Canción 🔄</button>
    </div>

    <div class="controls-guide" id="controls-guide"></div>
</div>
</body>
</html>
