<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Arcade - Mi Plataforma</title>
    <link rel="stylesheet" href="tetris.css">
    <script src="tetris.js" defer></script>
</head>
<body>
<div class="top-bar">
    <a href="../../index.html" class="btn-back">⬅️ Volver al Menú</a>
    <h1>Tetris Arcade 🧩</h1>
</div>

<div class="game-container">
    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="info-panel">
        <div class="score-board">
            <h3>PUNTOS</h3>
            <span id="score">0</span>
        </div>

        <div class="next-piece-box">
            <h3>SIGUIENTE</h3>
            <canvas id="next" width="80" height="80"></canvas>
        </div>

        <div id="game-over">
            <h2>GAME OVER</h2>
            <button onclick="reiniciarJuego()" class="btn-restart">Jugar de Nuevo</button>
        </div>

        <div class="controls">
            <strong>Controles:</strong><br>
            ⬅️ / ➡️ : Mover<br>
            ⬇️ : Caída rápida<br>
            ⬆️ / Z : Rotar<br>
            ESPACIO : Caída instantánea
        </div>
    </div>
</div>
</body>
</html>
