<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher or Lower - Casino Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../prestamos.css">
    <link rel="stylesheet" href="../casino-ui.css">
    <link rel="stylesheet" href="higher_lower.css">
    <script src="../prestamos.js"></script>
    <script src="../casino-ui.js" defer></script>
    <script src="higher_lower.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col items-center justify-between p-3 sm:p-6 select-none">

<!-- Header Unificado Estilo Blackjack -->
<header class="w-full max-w-6xl flex items-center justify-between bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl px-5 py-3 shadow-lg">
    <a href="../../../index.html" class="inline-flex items-center gap-2 text-emerald-400 hover:text-emerald-300 font-semibold text-sm sm:text-base transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Volver al Menú
    </a>
    <h1 class="text-xl sm:text-2xl font-black bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
        HIGHER OR LOWER ⬆️⬇️
    </h1>
    <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
        <span class="text-amber-400 font-bold">💰 $</span>
        <span id="fichas-count" class="font-bold text-amber-300 text-lg">1000</span>
    </div>
</header>

<!-- Contenedor Principal: Juego + Reglas a la Derecha -->
<div class="casino-layout w-full max-w-6xl flex flex-col lg:flex-row" gap-6 my-4 flex-1 items-start justify-center">

<!-- Mesa de Juego estilo Casino -->
<main class="flex-1 w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-2xl flex flex-col items-center justify-between gap-6">

    <!-- Marcador de Rachas y Multiplicador -->
    <div class="w-full flex flex-wrap items-center justify-between gap-3 bg-slate-950/60 border border-slate-800 rounded-2xl px-5 py-3">
        <div class="flex items-center gap-2">
            <span class="text-xs uppercase tracking-wider text-slate-400">Racha:</span>
            <span id="streak" class="text-emerald-400 font-black text-xl">0</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs uppercase tracking-wider text-slate-400">Premio Acumulado:</span>
            <span id="current-prize" class="text-amber-300 font-black text-xl">$0</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs uppercase tracking-wider text-slate-400">Mejor Racha:</span>
            <span id="best-streak" class="text-cyan-400 font-bold text-base">0</span>
        </div>
    </div>

    <!-- Área Central de Cartas (Mesa Fieltro) -->
    <div class="casino-table w-full rounded-2xl p-6 sm:p-10 flex flex-col items-center justify-center gap-6 relative min-h-[280px]">

        <div class="flex items-center justify-center gap-6 sm:gap-12">
            <!-- Carta Actual -->
            <div class="flex flex-col items-center gap-2">
                <span class="text-xs uppercase tracking-widest text-emerald-200 font-bold">Carta Actual</span>
                <div id="current-card-slot" class="card-slot">
                    <!-- Carta inyectada dinámicamente -->
                </div>
            </div>

            <!-- Indicador VS / Flecha -->
            <div class="text-slate-400 font-black text-2xl sm:text-3xl">VS</div>

            <!-- Siguiente Carta -->
            <div class="flex flex-col items-center gap-2">
                <span class="text-xs uppercase tracking-widest text-emerald-200 font-bold">Siguiente Carta</span>
                <div id="next-card-slot" class="card-slot">
                    <div class="card back"></div>
                </div>
            </div>
        </div>

        <!-- Banner Informativo -->
        <div id="status-banner" class="text-center py-2 px-6 rounded-xl font-bold text-base sm:text-lg transition-all duration-300">
            Selecciona tu apuesta y adivina si la próxima carta será MAYOR o MENOR
        </div>
    </div>

    <!-- Botones de Acción de Predicción -->
    <div class="w-full flex flex-wrap items-center justify-center gap-4">
        <button id="btn-higher" onclick="adivinar(true)" class="btn-action flex-1 max-w-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-lg">
            <span>MAYOR ⬆️</span>
        </button>
        <button id="btn-lower" onclick="adivinar(false)" class="btn-action flex-1 max-w-xs bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-lg">
            <span>MENOR ⬇️</span>
        </button>
        <button id="btn-cashout" onclick="cobrar()" disabled class="btn-action w-full sm:w-auto bg-amber-500 hover:bg-amber-400 disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-black py-3.5 px-8 rounded-2xl shadow-lg transition text-base">
            💰 Cobrar Premio
        </button>
    </div>

    <!-- Panel de Apuesta y Fichas Rápidas -->
    <div class="w-full bg-slate-950/70 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Apuesta Inicial:</span>
            <div class="relative flex items-center">
                <span class="absolute left-3 text-amber-400 font-bold">$</span>
                <input type="number" id="bet-input" min="10" step="10" value="50"
                       class="bg-slate-900 text-amber-300 font-bold pl-7 pr-3 py-2 rounded-xl border border-slate-700 w-28 focus:outline-none focus:border-emerald-500 text-center">
            </div>
        </div>

        <!-- Botones Rápidos de Fichas -->
        <div class="flex items-center gap-2">
            <button type="button" onclick="sumarApuesta(10)" class="chip btn-chip-10">+10</button>
            <button type="button" onclick="sumarApuesta(25)" class="chip btn-chip-25">+25</button>
            <button type="button" onclick="sumarApuesta(50)" class="chip btn-chip-50">+50</button>
            <button type="button" onclick="sumarApuesta(100)" class="chip btn-chip-100">+100</button>
            <button type="button" onclick="reiniciarApuesta()" class="text-xs px-2.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Borrar</button>
        </div>
    </div>
</main>
</div>

</body>
</html>
